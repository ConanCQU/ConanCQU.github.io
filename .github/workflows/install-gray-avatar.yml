name: Install grayscale avatar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the selected grayscale portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          payload = base64.b64decode(Path(".github/avatar-payload.txt").read_text(encoding="ascii"))
          assert hashlib.sha256(payload).hexdigest() == "2cd6ae3a7503541c710bf5cb8604ad93caadf802682ccbbdf7a7b73c3475172f"
          Path("assets/img/avatar.png").write_bytes(payload)
          about_path = Path("_pages/about.md")
          about = about_path.read_text(encoding="utf-8")
          assert '  image: prof_pic.jpg' in about or '  image: avatar_chibi.jpg' in about or '  image: avatar.png' in about
          about = about.replace('  image: prof_pic.jpg', '  image: avatar.png').replace('  image: avatar_chibi.jpg', '  image: avatar.png')
          css = ".profile img {\n  background-color: #fff;\n  border-radius: 50% !important;\n  box-shadow: none !important;\n  filter: grayscale(1);\n}\n"
          if '.profile img {' not in about:
              assert '<style>\n' in about
              about = about.replace('<style>\n', '<style>\n' + css, 1)
          about_path.write_text(about, encoding="utf-8")
          for filename in ('README.md', '_config.yml'):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace('prof_pic.jpg', 'avatar.png').replace('avatar_chibi.jpg', 'avatar.png'), encoding="utf-8")
          Path("assets/img/prof_pic.jpg").unlink(missing_ok=True)
          Path("assets/img/avatar_chibi.jpg").unlink(missing_ok=True)
          Path(".github/avatar-payload.txt").unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/img _pages/about.md _config.yml README.md .github/avatar-payload.txt
          if git diff --cached --quiet; then
            echo 'The selected grayscale avatar is already installed.'
            exit 0
          fi
          git commit -m 'Use selected grayscale icon portrait'
          git push
