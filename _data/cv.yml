        summary: Project lead (November 2025–present) — semantic-map-driven instruction generation for UAV vision-and-language navigation.
        highlights:
          - Built a pipeline from semantic mapping and 3D path planning to route abstraction and agent-adapted instruction generation.
          - Studied how instruction organization affects closed-loop navigation performance without fine-tuning navigation agents.
          - Improved mean navigation success rate by 9.85 percentage points across multiple agents.
          - Manuscript in preparation for CVPR.
      - name: Unitree H1 Teleoperation Data Collection
        date: 2025
        summary: Research contribution (June–August 2025) using Open-Teleoperation and Apple Vision Pro.
        highlights:
          - Collected dual-arm manipulation trajectories for grasping and placing target objects.
          - Annotated action sequences with language for vision-language-action alignment.
          - Filtered motion jitter, singular poses, and semantically misaligned samples.
